name: 📸 HTML to PNG

on:
  push:
    branches: [main]
    paths:
      - 'performances/**/*.html'
      - 'shared/**/*.html'
  workflow_dispatch:  # 수동 실행도 가능

jobs:
  convert:
    runs-on: ubuntu-latest
    concurrency:
      group: html-to-png
      cancel-in-progress: true
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 🔄 Pull latest (충돌 방지)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🔠 Install CJK Fonts & Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-noto-color-emoji fonts-noto-core fonts-symbola fonts-nanum fonts-ipafont-gothic fonts-wqy-zenhei chromium-browser
          sudo fc-cache -f -v

      - name: 📦 Install Puppeteer
        run: npm install puppeteer-core

      - name: 📸 Convert HTML → PNG
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium-browser
        run: |
          find . -name "*.png" -type f -delete
          node scripts/html-to-png.js

      - name: 📤 Commit & Push PNGs
        id: auto-commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: '📸 Auto-generate PNG from HTML'
          file_pattern: '.'
          push_options: '--force'

      - name: 🔔 Discord 알림 (이미지 임베드)
        if: always()
        run: |
          REPO="${{ github.repository }}"
          BASE="https://raw.githubusercontent.com/${REPO}/main"

          if [ "${{ steps.auto-commit.outcome }}" == "success" ]; then
            STATUS="✅ 성공"
            COLOR=3066993
          else
            STATUS="❌ 실패"
            COLOR=15158332
          fi

          # 변환된 PNG 파일 목록 (최대 4개 이미지 임베드)
          PNGS=$(find performances shared -name "*.png" 2>/dev/null | head -4)
          PNG_COUNT=$(find performances shared -name "*.png" 2>/dev/null | wc -l)

          # 첫 번째 임베드 (제목 + 개수)
          EMBEDS="[{\"title\":\"📸 HTML → PNG 변환 ${STATUS}\",\"description\":\"총 **${PNG_COUNT}개** PNG 생성됨\",\"color\":${COLOR},\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}"

          # 나머지 PNG 이미지 임베드 (최대 4개)
          for f in $PNGS; do
            URL="${BASE}/${f}"
            EMBEDS="${EMBEDS},{\"image\":{\"url\":\"${URL}\"},\"color\":${COLOR}}"
          done

          EMBEDS="${EMBEDS}]"

          curl -H "Content-Type: application/json" \
            -d "{\"embeds\":${EMBEDS}}" \
            ${{ secrets.DISCORD_WEBHOOK }}
