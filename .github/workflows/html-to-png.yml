name: 📸 HTML to PNG

on:
  push:
    branches: [main]
    paths:
      - 'performances/**/*.html'
      - 'shared/**/*.html'
  workflow_dispatch:  # 수동 실행도 가능

jobs:
  convert:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🔠 Install CJK Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-noto-color-emoji fonts-noto-core fonts-symbola fonts-nanum fonts-ipafont-gothic fonts-wqy-zenhei
          sudo fc-cache -f -v


      - name: 📦 Install Puppeteer & Local Fonts
        run: npm install puppeteer pretendard @fontsource/inter @fontsource/noto-sans-kr @fontsource/noto-sans-jp @fontsource/noto-sans-sc @fontsource/noto-color-emoji

      - name: 📸 Convert HTML → PNG
        run: |
          find . -name "*.png" -type f -delete  # 기존에 있던 모든 PNG 파일 완전 삭제 (추가된 줄)
          node scripts/html-to-png.js


      - name: 📤 Commit & Push PNGs
        id: auto-commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: '📸 Auto-generate PNG from HTML'
          file_pattern: '.'

      - name: 🔔 Discord 알림 (이미지 링크 포함)
        if: always()
        run: |
          REPO="${{ github.repository }}"
          BASE="https://raw.githubusercontent.com/${REPO}/main"

          if [ "${{ steps.auto-commit.outcome }}" == "success" ]; then
            STATUS="✅ 성공"
            COLOR=3066993
          else
            STATUS="❌ 실패"
            COLOR=15158332
          fi

          # PNG 파일 목록 + raw URL 생성
          IMG_LINES=""
          for f in $(find performances shared -name "*.png" -newer scripts/html-to-png.js 2>/dev/null | head -15); do
            IMG_LINES="${IMG_LINES}🖼️ [${f}](${BASE}/${f})\n"
          done
          [ -z "$IMG_LINES" ] && IMG_LINES="변환된 파일 없음"

          # 첫 번째 PNG를 썸네일로 표시
          FIRST_PNG=$(find performances shared -name "*.png" -newer scripts/html-to-png.js 2>/dev/null | head -1)
          THUMB=""
          if [ -n "$FIRST_PNG" ]; then
            THUMB=",\"image\":{\"url\":\"${BASE}/${FIRST_PNG}\"}"
          fi

          curl -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"📸 HTML → PNG 변환 ${STATUS}\",\"description\":\"${IMG_LINES}\",\"color\":${COLOR},\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"${THUMB}}]}" \
            ${{ secrets.DISCORD_WEBHOOK }}
